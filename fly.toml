app = "gamma-analytics"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8050"
  GEX_DATA_DIR = "/data"
  GEX_SHARED_DEPLOYMENT = "true"

[http_service]
  internal_port = 8050
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  interval = "15s"
  timeout = "10s"
  grace_period = "5s"
  method = "GET"
  path = "/healthz"

[deploy]
  strategy = "rolling"

[[mounts]]
  source = "gamma_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
